name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Creates the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Check that the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uvx hatch version)"

      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Release ${GITHUB_REF_NAME#v}" --notes-file release_notes.md --verify-tag

  publish:
    name: Publish to PyPI
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Trusted Publishing exchanges this for a short-lived PyPI token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - run: uvx hatchling build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
