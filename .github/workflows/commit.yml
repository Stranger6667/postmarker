name: Checks for every commit

on:
  pull_request: ~
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  commitsar:
    name: Verify commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run commitsar
        uses: docker://aevea/commitsar:1.0.3@sha256:b7f965c7717aae9339a92cc5975b5e0130b3a5b5f6e4323a57ab421d8c39f13d
