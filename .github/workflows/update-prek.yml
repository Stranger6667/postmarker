name: Update prek

on:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions:
      # Opens the autoupdate pull request.
      contents: write
      pull-requests: write
    name: Update prek
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uvx prek autoupdate

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-branch: true
          title: Update prek
          body: Automatically update prek hooks
          commit-message: 'chore: Update prek'
          committer: 'Stranger6667 <dmitry@dygalo.dev>'
          author: 'Stranger6667 <dmitry@dygalo.dev>'
          branch: "create-pull-request/update-prek"
