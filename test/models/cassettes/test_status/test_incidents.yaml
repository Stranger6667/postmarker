        everyone posted as we have more answers.\",\"status\":\"Investigating\",\"timestamp\":\"2016-05-26T10:19:00+00:00\"},{\"body\":\"We've
        identified the DDOS sources and have filters in place now. Connectivity is
        coming back but we want to continue monitoring to be sure. Stand by.\",\"status\":\"Pending\",\"timestamp\":\"2016-05-26T10:38:00+00:00\"},{\"body\":\"We've
        confirmed that all services are back to normal and the attack has been mitigated.
        Emails queued during the outage will be retried and sent. We'll do a more
        in depth review and post when we have more info.\",\"status\":\"Resolved\",\"timestamp\":\"2016-05-26T10:44:00+00:00\"},{\"body\":\"Overview
        of today's DDOS attack:\",\"status\":\"Resolved\",\"timestamp\":\"2016-05-26T14:31:00+00:00\"}],\"resolved_at\":\"2016-05-26T14:31:00+00:00\",\"body\":\"<p>At
        around 5:54am ET we were a target of a DDOS attack. This attack lasted about
        40 minutes until we were able to block it, stopping around 6:34am ET. At that
        time all services became available again.&nbsp;</p>\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n<p>This
        was a widespread outage on all services. Our API did fail over to a second
        data center to queue messages while the primary data center was down. These
        messages were submitted again once the application came back.</p>\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n<p>The
        attack was identified as an IP Fragmentation Attack (<a href=\\\"https://www.incapsula.com/ddos/attack-glossary/ip-fragmentation-attack-teardrop.html\\\">https://www.incapsula.com/ddos/attack-glossary/ip-fragmentation-attack-teardrop.html</a>)
        which was targeted at one of our mail servers. The size of the attack managed
        to take down our firewalls, essentially preventing any traffic to our endpoints.&nbsp;</p>\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n<p>This
        is not our first DDOS, so we are working hard to find a solution. Part of
        this involves hardware devices to mitigate the attacks automatically, but
        we also need to spend some time on our network design to prevent it further.&nbsp;</p>\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n\\r\\n<p>We're
        really sorry for the issues. We know you depend on us and no matter what the
        cause, it is our responsibility to keep everything available. We're working
