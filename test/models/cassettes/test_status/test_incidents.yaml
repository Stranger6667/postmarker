        attack on our network. Email requests are being saved while we work to resolve
        this. We\u2019ll update here as we have more information\",\"status\":\"Investigating\",\"timestamp\":\"2016-06-01T23:23:00+00:00\"},{\"body\":\"Services
        are back up now & we're working through the queues. A major network issue
