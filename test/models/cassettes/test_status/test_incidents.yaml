        any issues.  We will continue to monitor very closely.\",\"status\":\"Resolved\",\"timestamp\":\"2016-06-01T23:55:00+00:00\"}],\"resolved_at\":\"2016-06-01T23:55:00+00:00\",\"body\":\"\"},{\"id\":\"1639\",\"type\":\"DEGRADED\",\"created_at\":\"2016-05-31T14:29:00+00:00\",\"updated_at\":\"2016-05-31T14:59:00+00:00\",\"title\":\"Messages
