default_language_version:
  python: python3.10

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^.*\.(md|rst)$
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # CI runners ship shellcheck, so pin it here too or the hook is stricter on CI than locally.
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        # Offline keeps the hook deterministic; online audits would need a GitHub token.
        args: [--no-progress, --offline]
        # The hook package requires Python 3.11+
        language_version: python3.11

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos
        # Report, don't rewrite
        args: [--force-exclude]
        exclude: (^|/)cassettes/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Installs the project with its dependencies, so third-party types are checked.
        entry: uvx --python 3.10 --with-editable=.[tests] --with=types-requests mypy==2.4.0
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^(docs/|test/(?!typing_checks\.py$)).*$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --show-fixes]
