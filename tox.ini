[tox]
envlist =
    py{310,311,312,313,314,315}-django52
    py{312,313,314,315}-django{60,61}
    pypy311-django52

[testenv]
extras = tests
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
passenv =
    SERVER_TOKEN
    ACCOUNT_TOKEN
commands =
    coverage run -m pytest {posargs:test}
    coverage combine
    coverage report
    coverage xml -i

[testenv:record]
extras = tests
deps = Django
commands = pytest --record {posargs:test}
